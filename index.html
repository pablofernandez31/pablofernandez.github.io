<!DOCTYPE html>
<!--
  Customize at SITE object near
  the top of the <script> at the bottom:
    - name / status line
    - projects[]
    - posts[]  (blog posts, written in .md)
    - about text + coursework
    - contact info
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pablo fernández — Portfolio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-sidebar:#2b303b;
    --bg-editor:#343d46;
    --bg-elevated:#3b4252;
    --bg-tab-inactive:#2f3640;
    --fg:#d8dee9;
    --fg-dim:#828d99;
    --fg-dimmer:#5b6472;
    --border:#232830;
    --accent-blue:#6699cc;
    --accent-orange:#fcbb6a;
    --accent-green:#99c794;
    --accent-red:#ec5f66;
    --accent-yellow:#fac863;
    --accent-purple:#c594c5;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
    --line-h:26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg-sidebar);}
  body{
    font-family:var(--mono);
    color:var(--fg);
    font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-blue);text-decoration:none;}
  a:hover{text-decoration:underline;}
  :focus-visible{outline:2px solid var(--accent-orange);outline-offset:2px;}
  ul{margin:0;padding-left:1.2em;}
  code{
    background:var(--bg-elevated);
    color:var(--accent-yellow);
    padding:.12em .4em;
    border-radius:3px;
    font-size:.92em;
  }
  pre{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:4px;
    padding:14px 16px;
    overflow-x:auto;
  }
  pre code{background:none;padding:0;color:var(--accent-green);}

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* Titlebar */
  .titlebar{
    display:flex;align-items:center;gap:14px;
    height:38px;flex:0 0 auto;
    background:var(--bg-sidebar);
    padding:0 14px;
    border-bottom:1px solid var(--border);
  }
  .traffic-lights{display:flex;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .dot.red{background:var(--accent-red);}
  .dot.yellow{background:var(--accent-yellow);}
  .dot.green{background:var(--accent-green);}
  .titlebar-label{
    flex:1;text-align:center;
    color:var(--fg-dim);font-size:12.5px;
    letter-spacing:.02em;
  }
  .cmdk-trigger{
    background:var(--bg-elevated);
    color:var(--fg-dim);
    border:1px solid var(--border);
    border-radius:4px;
    padding:4px 9px;
    font-family:var(--mono);
    font-size:11.5px;
    cursor:pointer;
  }
  .cmdk-trigger:hover{color:var(--fg);border-color:var(--accent-blue);}

  /* Tab bar */
  .tabbar{
    display:flex;flex:0 0 auto;
    background:var(--bg-sidebar);
    overflow-x:auto;
    border-bottom:1px solid var(--border);
    scrollbar-width:thin;
  }
  .tab{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-tab-inactive);
    color:var(--fg-dim);
    border:none;border-right:1px solid var(--border);
    padding:9px 14px;
    font-family:var(--mono);font-size:12.5px;
    cursor:pointer;white-space:nowrap;
    border-top:2px solid transparent;
  }
  .tab .dotcolor{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .tab.active{
    background:var(--bg-editor);
    color:var(--fg);
    border-top:2px solid var(--accent-orange);
  }
  .tab:hover:not(.active){color:var(--fg);}
  .tab .close{
    color:var(--fg-dimmer);
    border-radius:3px;
    width:16px;height:16px;
    line-height:16px;text-align:center;
    font-size:13px;
  }
  .tab .close:hover{background:var(--accent-red);color:#fff;}

  /* Workspace */
  .workspace{flex:1 1 auto;display:flex;min-height:0;}
  .gutter{
    flex:0 0 auto;width:46px;
    background:var(--bg-editor);
    color:var(--fg-dimmer);
    text-align:right;
    padding:22px 10px 22px 0;
    font-size:12.5px;line-height:var(--line-h);
    user-select:none;
    border-right:1px solid var(--border);
    overflow:hidden;
  }
  .editor{
    flex:1 1 auto;
    background:var(--bg-editor);
    overflow-y:auto;
    padding:26px 28px 60px;
  }
  .pane{display:none;max-width:700px;margin:0 auto;line-height:var(--line-h);}
  .pane.active{display:block;}

  .comment{color:var(--fg-dimmer);font-style:italic;}
  .kw{color:var(--accent-purple);}
  .str{color:var(--accent-green);}
  .prop{color:var(--accent-blue);}

  /* ---------- Home ---------- */
  .hero-code{font-size:1.05em;margin:0 0 22px;}
  .hero-code .line{white-space:pre-wrap;}
  .caret{
    display:inline-block;width:8px;height:1.1em;
    background:var(--accent-orange);
    vertical-align:text-bottom;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion:reduce){ .caret{animation:none;} }
  .lede{color:var(--fg);max-width:62ch;margin:0 0 22px;line-height:1.65;}
  .quicklinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .quicklinks a{
    border:1px solid var(--border);
    background:var(--bg-elevated);
    padding:6px 12px;border-radius:4px;
    color:var(--fg);font-size:13px;
  }
  .quicklinks a:hover{border-color:var(--accent-blue);text-decoration:none;}

  /* Projects */
  .project{
    border:1px solid var(--border);
    background:var(--bg-elevated);
    border-radius:5px;
    padding:18px 20px;margin-bottom:20px;
  }
  .project .comment{display:block;margin-bottom:8px;}
  .project h3{margin:0 0 8px;font-size:1.02em;color:var(--fg);}
  .project p{margin:0 0 10px;color:var(--fg);line-height:1.6;font-size:.95em;}
  .stack-line{color:var(--fg-dim);font-size:.85em;margin-bottom:10px;}
  .stack-line .str{color:var(--accent-yellow);}
  .project-links a{margin-right:14px;font-size:.9em;}

  /* Blog */
  .post-item{
    border-bottom:1px solid var(--border);
    padding:16px 0;cursor:pointer;
  }
  .post-item:first-child{padding-top:0;}
  .post-item h3{margin:0 0 4px;font-size:1em;color:var(--fg);}
  .post-item h3::before{content:"# ";color:var(--accent-purple);}
  .post-date{color:var(--fg-dimmer);font-size:.78em;margin-bottom:6px;}
  .post-excerpt{color:var(--fg-dim);font-size:.9em;line-height:1.55;}
  .post-item .open-tag{color:var(--accent-blue);font-size:.78em;}
  .post-detail .back{display:inline-block;margin-bottom:18px;font-size:.85em;color:var(--fg-dim);}
  .post-detail h1{font-size:1.3em;margin:0 0 4px;color:var(--fg);}
  .post-detail .post-date{margin-bottom:18px;}
  .post-detail p{line-height:1.7;color:var(--fg);}
  .post-detail h1,.post-detail h2,.post-detail h3{color:var(--fg);}
  .post-detail ul{color:var(--fg);line-height:1.7;margin-bottom:14px;}

  /* About */
  .about p{line-height:1.7;color:var(--fg);}
  .about h2{font-size:.95em;color:var(--accent-blue);margin:24px 0 10px;}
  .about ul{color:var(--fg);line-height:1.75;}

  /* Contact */
  .kv{display:flex;gap:14px;padding:5px 0;font-size:.95em;}
  .kv .key{color:var(--accent-purple);width:110px;flex:0 0 auto;}
  .kv .val{color:var(--fg);}

  /* Status bar */
  .statusbar{
    flex:0 0 auto;height:26px;
    background:var(--accent-blue);
    color:#1c2530;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;font-size:11.5px;
    font-weight:500;
  }
  .statusbar span{margin-right:16px;}
  .statusbar span:last-child{margin-right:0;}

  /* Command palette */
  .palette-overlay{
    position:fixed;inset:0;background:rgba(15,18,23,.55);
    display:none;align-items:flex-start;justify-content:center;
    padding-top:12vh;z-index:50;
  }
  .palette-overlay.open{display:flex;}
  .palette{
    width:min(560px,90vw);
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    overflow:hidden;
  }
  #paletteInput{
    width:100%;background:var(--bg-sidebar);color:var(--fg);
    border:none;border-bottom:1px solid var(--border);
    padding:14px 16px;font-family:var(--mono);font-size:14px;
  }
  #paletteInput:focus{outline:none;}
  #paletteList{list-style:none;margin:0;padding:6px;max-height:320px;overflow-y:auto;}
  #paletteList li{
    padding:9px 12px;border-radius:4px;cursor:pointer;
    display:flex;justify-content:space-between;gap:10px;font-size:13px;
  }
  #paletteList li:hover, #paletteList li.sel{background:var(--bg-sidebar);}
  #paletteList li .tag{color:var(--fg-dimmer);font-size:11px;}

  /* Responsive */
  @media (max-width:640px){
    .gutter{display:none;}
    .editor{padding:20px 16px 50px;}
    .titlebar-label{display:none;}
    .statusbar span{margin-right:10px;font-size:10.5px;}
    .statusbar .hide-mobile{display:none;}
  }
</style>
</head>
<body>
<div id="app">

  <div class="titlebar">
    <div class="traffic-lights">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
    </div>
    <div class="titlebar-label" id="titlebarLabel">yourname — Sublime Text</div>
    <button class="cmdk-trigger" id="cmdkTrigger" title="Command palette">⌘K Go to anything</button>
  </div>

  <div class="tabbar" id="tabbar" role="tablist">
    <button class="tab active" data-target="home" role="tab"><span class="dotcolor" style="background:var(--accent-orange)"></span>home.html</button>
    <button class="tab" data-target="projects" role="tab"><span class="dotcolor" style="background:var(--accent-yellow)"></span>projects.js</button>
    <button class="tab" data-target="blog" role="tab"><span class="dotcolor" style="background:var(--accent-green)"></span>blog.md</button>
    <button class="tab" data-target="about" role="tab"><span class="dotcolor" style="background:var(--accent-blue)"></span>about.md</button>
    <button class="tab" data-target="contact" role="tab"><span class="dotcolor" style="background:var(--accent-purple)"></span>contact.txt</button>
  </div>

  <div class="workspace">
    <div class="gutter" id="gutter"></div>
    <main class="editor" id="editor">
      <section class="pane active" id="pane-home"></section>
      <section class="pane" id="pane-projects"></section>
      <section class="pane" id="pane-blog"></section>
      <section class="pane" id="pane-about"></section>
      <section class="pane" id="pane-contact"></section>
    </main>
  </div>

  <div class="statusbar">
    <div class="status-left">
      <span id="statusFile">home.html</span>
      <span id="statusMode">HTML</span>
    </div>
    <div class="status-right">
      <span id="statusWords" class="hide-mobile">0 words</span>
      <span class="hide-mobile">Spaces: 2</span>
      <span>UTF-8</span>
      <span id="statusTime"></span>
    </div>
  </div>

  <div class="palette-overlay" id="paletteOverlay">
    <div class="palette">
      <input type="text" id="paletteInput" placeholder="Go to anything… (tabs, projects, posts)" autocomplete="off" spellcheck="false">
      <ul id="paletteList"></ul>
    </div>
  </div>

</div>

<script>
/* Important: Page Composition */
const SITE = {
  name: "Introduction",
  status: "grinding",

  projects: [
    {
      name: "project-name",
      description: "project is about this",
      stack: ["python"],
      repo: "link-to-repo",
      demo: "link-to-demo if available"
    }
  ],

  posts: [
    {
      slug: "sample-post",
      title: "Why Tung Tung Sahur is definitively the best brainrot character.",
      date: "2026-08-14",
      excerpt: "Summary",
      body:
`blog post`
    }
  ],

  about: {
    intro:
`introduction about self`,
    coursework: [
      "hella aps",
      "intro to 2d art"
    ]
  },

  contact: {
    email: "the mail",
    github: "the github",
    linkedin: "connect w me",
    location: "Kazakhstan"
  }
};

/* ============================================================
   Tiny markdown -> HTML converter (no external dependencies)
   Supports: # ## ### headers, **bold**, *italic*, `code`,
   ```code blocks```, [links](url), - lists, paragraphs.
   ============================================================ */
function mdToHtml(md){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let text = esc(md.trim());
  text = text.replace(/```([\s\S]*?)```/g, (m, code) => `<pre><code>${code.trim()}</code></pre>`);
  text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  text = text.replace(/(^|\n)((?:- .*(?:\n|$))+)/g, (m, pre, block) => {
    const items = block.trim().split("\n").map(l => `<li>${l.replace(/^- /, "")}</li>`).join("");
    return `${pre}<ul>${items}</ul>`;
  });
  return text.split(/\n{2,}/).map(block => {
    const t = block.trim();
    if (/^<(h1|h2|h3|ul|pre)/.test(t)) return t;
    if (t === "") return "";
    return `<p>${t.replace(/\n/g, "<br>")}</p>`;
  }).join("\n");
}

function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { year:"numeric", month:"long", day:"numeric" });
}

/* ============================================================
   Render each pane from SITE
   ============================================================ */
function renderHome(){
  const el = document.getElementById("pane-home");
  el.innerHTML = `
    <div class="hero-code">
      <div class="comment">// portfolio.init()</div>
      <div class="line"><span class="kw">const</span> <span class="prop">developer</span> = {</div>
      <div class="line">&nbsp;&nbsp;name: <span class="str">"${SITE.name}"</span>,</div>
      <div class="line">&nbsp;&nbsp;focus: [<span class="str">"Computer Science"</span>, <span class="str">"Electrical Engineering"</span>],</div>
      <div class="line">&nbsp;&nbsp;status: <span class="str">"${SITE.status}"</span>,</div>
      <div class="line">};<span class="caret"></span></div>
    </div>
    <p class="lede">Welcome — this is my portfolio site. Use the tabs above (or press <code>⌘K</code>) to browse my projects, read the blog, or find contact info.</p>
    <div class="quicklinks">
      <a href="https://${SITE.contact.github}" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:${SITE.contact.email}">Email</a>
      <a href="#" data-goto="projects">View Projects →</a>
    </div>
  `;
  el.querySelector('[data-goto="projects"]').addEventListener("click", e => { e.preventDefault(); switchTab("projects"); });
}

function renderProjects(){
  const el = document.getElementById("pane-projects");
  el.innerHTML = SITE.projects.map(p => `
    <div class="project">
      <span class="comment">/* ${p.name} */</span>
      <p>${p.description}</p>
      <div class="stack-line">stack: [${p.stack.map(s => `<span class="str">"${s}"</span>`).join(", ")}]</div>
      <div class="project-links">
        ${p.repo ? `<a href="${p.repo}" target="_blank" rel="noopener">viewRepo()</a>` : ""}
        ${p.demo ? `<a href="${p.demo}" target="_blank" rel="noopener">viewDemo()</a>` : ""}
      </div>
    </div>
  `).join("");
}

function renderBlogList(){
  const el = document.getElementById("pane-blog");
  el.innerHTML = SITE.posts.map(p => `
    <div class="post-item" data-slug="${p.slug}">
      <h3>${p.title}</h3>
      <div class="post-date">${fmtDate(p.date)}</div>
      <div class="post-excerpt">${p.excerpt}</div>
      <div class="open-tag">open ${p.slug}.md →</div>
    </div>
  `).join("");
  el.querySelectorAll(".post-item").forEach(item => {
    item.addEventListener("click", () => openPost(item.dataset.slug));
  });
}

function renderPost(post){
  const id = "pane-post-" + post.slug;
  let pane = document.getElementById(id);
  if (!pane){
    pane = document.createElement("section");
    pane.className = "pane";
    pane.id = id;
    document.getElementById("editor").appendChild(pane);
  }
  pane.innerHTML = `
    <div class="post-detail">
      <a href="#" class="back" data-goto="blog">← back to blog.md</a>
      <h1>${post.title}</h1>
      <div class="post-date">${fmtDate(post.date)}</div>
      ${mdToHtml(post.body)}
    </div>
  `;
  pane.querySelector('[data-goto="blog"]').addEventListener("click", e => { e.preventDefault(); switchTab("blog"); });
  return pane;
}

function renderAbout(){
  const el = document.getElementById("pane-about");
  el.innerHTML = `<div class="about">${mdToHtml(SITE.about.intro)}
    <h2>// coursework</h2>
    <ul>${SITE.about.coursework.map(c => `<li>${c}</li>`).join("")}</ul>
  </div>`;
}

function renderContact(){
  const c = SITE.contact;
  const el = document.getElementById("pane-contact");
  el.innerHTML = `
    <div class="kv"><span class="key">NAME</span><span class="val">"${SITE.name}"</span></div>
    <div class="kv"><span class="key">EMAIL</span><span class="val"><a href="mailto:${c.email}">${c.email}</a></span></div>
    <div class="kv"><span class="key">GITHUB</span><span class="val"><a href="https://${c.github}" target="_blank" rel="noopener">${c.github}</a></span></div>
    <div class="kv"><span class="key">LINKEDIN</span><span class="val"><a href="https://${c.linkedin}" target="_blank" rel="noopener">${c.linkedin}</a></span></div>
    <div class="kv"><span class="key">LOCATION</span><span class="val">${c.location}</span></div>
  `;
}

/* ============================================================
   Tab / pane switching, gutter, status bar
   ============================================================ */
const CORE_TABS = {
  home:    { label:"home.html",     mode:"HTML" },
  projects:{ label:"projects.js",   mode:"JavaScript" },
  blog:    { label:"blog.md",       mode:"Markdown" },
  about:   { label:"about.md",      mode:"Markdown" },
  contact: { label:"contact.txt",   mode:"Plain Text" }
};

function switchTab(id){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.target === id));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("active", p.id === "pane-" + id));
  const meta = CORE_TABS[id] || { label: id.replace("post-","") + ".md", mode: "Markdown" };
  document.getElementById("statusFile").textContent = meta.label;
  document.getElementById("statusMode").textContent = meta.mode;
  document.getElementById("titlebarLabel").textContent = SITE.name.toLowerCase().replace(/\s+/g,"") + " — Sublime Text — " + meta.label;
  location.hash = id.startsWith("post-") ? "blog/" + id.slice(5) : id;
  updateGutter();
  updateWordCount();
}

function openPost(slug){
  const post = SITE.posts.find(p => p.slug === slug);
  if (!post) return;
  const tabId = "post-" + slug;
  if (!document.querySelector(`.tab[data-target="${tabId}"]`)){
    renderPost(post);
    const tab = document.createElement("button");
    tab.className = "tab";
    tab.dataset.target = tabId;
    tab.setAttribute("role","tab");
    tab.innerHTML = `<span class="dotcolor" style="background:var(--accent-green)"></span>${slug}.md<span class="close">×</span>`;
    tab.addEventListener("click", (e) => {
      if (e.target.classList.contains("close")){
        e.stopPropagation();
        closeTab(tabId);
      } else {
        switchTab(tabId);
      }
    });
    document.querySelector('.tab[data-target="blog"]').insertAdjacentElement("afterend", tab);
  }
  switchTab(tabId);
}

function closeTab(tabId){
  const tab = document.querySelector(`.tab[data-target="${tabId}"]`);
  const pane = document.getElementById("pane-" + tabId);
  const wasActive = tab && tab.classList.contains("active");
  if (tab) tab.remove();
  if (pane) pane.remove();
  if (wasActive) switchTab("blog");
}

function updateGutter(){
  const active = document.querySelector(".pane.active");
  const gutter = document.getElementById("gutter");
  if (!active || !gutter) return;
  const lineHeight = 26;
  const lines = Math.max(24, Math.ceil(active.scrollHeight / lineHeight) + 3);
  let html = "";
  for (let i = 1; i <= lines; i++) html += `<div>${i}</div>`;
  gutter.innerHTML = html;
}

function updateWordCount(){
  const active = document.querySelector(".pane.active");
  if (!active) return;
  const words = (active.innerText || "").trim().split(/\s+/).filter(Boolean).length;
  document.getElementById("statusWords").textContent = words + " words";
}

function updateClock(){
  const now = new Date();
  document.getElementById("statusTime").textContent = now.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit" });
}

/* ============================================================
   Command palette
   ============================================================ */
function paletteItems(){
  const items = [];
  Object.entries(CORE_TABS).forEach(([id, meta]) => items.push({ label: meta.label, tag:"tab", action:() => switchTab(id) }));
  SITE.projects.forEach(p => items.push({ label: p.name, tag:"project", action:() => switchTab("projects") }));
  SITE.posts.forEach(p => items.push({ label: p.title, tag:"post", action:() => openPost(p.slug) }));
  return items;
}

function openPalette(){
  const overlay = document.getElementById("paletteOverlay");
  const input = document.getElementById("paletteInput");
  overlay.classList.add("open");
  input.value = "";
  renderPaletteList("");
  input.focus();
}
function closePalette(){
  document.getElementById("paletteOverlay").classList.remove("open");
}
function renderPaletteList(query){
  const list = document.getElementById("paletteList");
  const q = query.trim().toLowerCase();
  const items = paletteItems().filter(i => i.label.toLowerCase().includes(q));
  list.innerHTML = items.map((i, idx) => `<li data-idx="${idx}"${idx===0 ? ' class="sel"' : ''}>${i.label}<span class="tag">${i.tag}</span></li>`).join("");
  list.querySelectorAll("li").forEach((li, idx) => {
    li.addEventListener("click", () => { items[idx].action(); closePalette(); });
  });
  list.dataset.count = items.length;
  list._items = items;
}

document.getElementById("cmdkTrigger").addEventListener("click", openPalette);
document.getElementById("paletteOverlay").addEventListener("click", e => { if (e.target.id === "paletteOverlay") closePalette(); });
document.getElementById("paletteInput").addEventListener("input", e => renderPaletteList(e.target.value));
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
    e.preventDefault();
    document.getElementById("paletteOverlay").classList.contains("open") ? closePalette() : openPalette();
  }
  if (e.key === "Escape") closePalette();
  if (e.key === "Enter"){
    const list = document.getElementById("paletteList");
    const sel = list.querySelector("li.sel");
    if (sel && document.getElementById("paletteOverlay").classList.contains("open")){
      list._items[Number(sel.dataset.idx)].action();
      closePalette();
    }
  }
});

/* ============================================================
   Wire up static tabs + init
   ============================================================ */
document.querySelectorAll('.tab[data-target]').forEach(tab => {
  tab.addEventListener("click", () => switchTab(tab.dataset.target));
});

renderHome();
renderProjects();
renderBlogList();
renderAbout();
renderContact();

window.addEventListener("resize", () => updateGutter());
setInterval(updateClock, 1000);
updateClock();

(function initRoute(){
  const hash = location.hash.replace("#", "");
  if (hash.startsWith("blog/")){
    const slug = hash.slice(5);
    if (SITE.posts.some(p => p.slug === slug)) { openPost(slug); return; }
  }
  if (CORE_TABS[hash]) { switchTab(hash); return; }
  switchTab("home");
})();
</script>
